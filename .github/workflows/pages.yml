# Publishes the game on GitHub Pages after every push to main (Settings → Pages → Source: GitHub Actions).
name: Publish the game

# Only when something on the site changes (see tools/build-site.js).
on:
  push:
    branches: [main]
    paths: ["index.html", "privacy.html", "manifest.webmanifest", "sw.js", "css/**", "js/**", "icons/**", "fonts/**", "tools/build-site.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running one is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Build the site
        run: node tools/build-site.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
