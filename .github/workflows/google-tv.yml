# Builds the Android app (phone, tablet and Google TV) with the game inside. On main every build becomes its own release
# "android-v1.<run>" with the .apk; tripscouts.online/android always sends you to the newest one, for the Downloader app on
# the TV. See docs/google-tv.md.
name: Build the Android app

on:
  push:
    branches: [main]
    paths: ["android-tv/**", "index.html", "privacy.html", "manifest.webmanifest", "sw.js", "css/**", "js/**", "icons/**", "fonts/**", "tools/build-site.js", ".github/workflows/google-tv.yml"]
  pull_request:
    paths: ["android-tv/**", "index.html", "privacy.html", "manifest.webmanifest", "sw.js", "css/**", "js/**", "icons/**", "fonts/**", "tools/build-site.js", ".github/workflows/google-tv.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Android app
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Is there a fixed key? Then we also build the bundle for Google Play.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # The alias of the key: "cabinweek" by default; set the repository variable ANDROID_KEY_ALIAS to reuse a key with another alias.
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'cabinweek' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.3'

      - name: Put the game in the app
        run: |
          # the Android SDK is already on the GitHub runner
          echo "sdk.dir=$ANDROID_HOME" > android-tv/local.properties
          node tools/build-site.js
          rm -rf android-tv/app/src/main/assets
          mkdir -p android-tv/app/src/main/assets
          cp -r _site android-tv/app/src/main/assets/game

      - name: Fixed key (optional, so updates install over the old app)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then exit 0; fi
          # Tolerates line breaks (also Windows), spaces, the header and footer lines of certutil and URL-safe base64.
          CLEAN=$(printf '%s' "$KEYSTORE" | grep -v -- '-----' | tr -d ' \r\n\t' | tr '_-' '/+')
          # The '=' or '==' at the end often get lost when copying: add them back (keytool below catches a really truncated key).
          while [ $(( ${#CLEAN} % 4 )) -eq 2 ] || [ $(( ${#CLEAN} % 4 )) -eq 3 ]; do CLEAN="$CLEAN="; done
          # Python instead of base64 -d: the base64 of Ubuntu 26.04 (uutils) is very strict about the last characters.
          if ! printf '%s' "$CLEAN" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > android-tv/keystore.jks 2> /dev/null; then
            # Safe details (no content): help to see what is in the secret.
            BAD=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
            echo "The secret has ${#CLEAN} characters (remainder when divided by 4: $(( ${#CLEAN} % 4 ))), of which $BAD do not belong in base64."
            if [ "${#CLEAN}" -lt 1000 ]; then echo "That is too short for a key file (usually 2500 to 4000 characters): does it contain the file name, a path or the password?"; fi
            if [ "$BAD" -gt 0 ]; then echo "It contains characters that do not belong in base64: was text or keytool output pasted along?"; fi
            if [ "$BAD" -eq 0 ] && [ $(( ${#CLEAN} % 4 )) -ne 0 ]; then echo "The length is wrong: was the text cut off when copying?"; fi
            # A '=' belongs only at the very end; earlier means something was pasted along (such as "NAME=" or the text twice).
            EQ=$(printf '%s' "$CLEAN" | grep -ob '=' | cut -d: -f1 | awk -v n="${#CLEAN}" '$1 < n - 2 { printf "%s ", $1 + 1 }')
            if [ -n "$EQ" ]; then echo "There is a '=' in the middle of the text (at position $EQ of ${#CLEAN}). Is the name in front (ANDROID_KEYSTORE_BASE64=...), or was the text pasted twice? Paste only the text itself."; fi
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 text of the keystore. Make it again with the command for your computer in docs/google-tv.md."
            exit 1
          fi
          if ! KT=$(keytool -list -keystore android-tv/keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>&1); then
            echo "keytool says: $(printf '%s' "$KT" | grep -v JAVA_TOOL_OPTIONS | tail -1)"
            echo "Decoded: $(wc -c < android-tv/keystore.jks) bytes (a key is usually 2500 to 2800 bytes)."
            echo "::error::The key does not open. With 'password was incorrect': check ANDROID_KEYSTORE_PASSWORD. With 'alias does not exist': make the key with -alias cabinweek, or set the repository variable ANDROID_KEY_ALIAS (now: $ANDROID_KEY_ALIAS). With another message the text in ANDROID_KEYSTORE_BASE64 is incomplete: make it again (see docs/google-tv.md)."
            exit 1
          fi
          echo "The key is fine."

      - name: Build the app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android-tv assembleDebug --no-daemon
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk cabin-week.apk

      # For Google Play: a signed app bundle (.aab). Only with a fixed key in the secrets,
      # because Google Play does not accept an unsigned bundle. See docs/google-tv.md.
      # Without a key we still build the release variant, so errors in it (such as lint) show up right away;
      # only with a key do we keep the bundle.
      - name: Build the bundle for Google Play (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android-tv bundleRelease --no-daemon
          if [ "$HAS_KEY" = "true" ]; then cp android-tv/app/build/outputs/bundle/release/app-release.aab cabin-week.aab; fi

      - name: Notice when there is no key
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::No .aab for Google Play built: first set the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (see docs/google-tv.md)."

      - name: Keep the app
        uses: actions/upload-artifact@v7
        with:
          name: cabin-week-google-tv
          path: cabin-week.apk
          if-no-files-found: warn
          retention-days: 30

      # The bundle for Google Play is not public: only in a 7z file with a password (ANDROID_KEYSTORE_PASSWORD),
      # and never on the release. Anyone with a GitHub account can download an artifact of a public repository.
      - name: Encrypt the bundle for Google Play
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          command -v 7z > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq 7zip; }
          # with the R8 mapping file (Play also gets it inside the bundle; this copy is for uploading by hand if needed)
          MAP=android-tv/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAP" ]; then cp "$MAP" cabin-week-mapping.txt; fi
          7z a -t7z -mhe=on -p"$ANDROID_KEYSTORE_PASSWORD" cabin-week-google-play.7z cabin-week.aab $( [ -f cabin-week-mapping.txt ] && echo cabin-week-mapping.txt ) > /dev/null
          rm cabin-week.aab

      - name: Keep the bundle for Google Play (with a password)
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cabin-week-google-play
          path: cabin-week-google-play.7z
          retention-days: 7

      # Releases in this repository are immutable: once published, nothing can be added or replaced. So every build on
      # main gets its own release, "android-v1.<run>" like the app's versionName, created with the .apk in one go. It is
      # never marked as the latest release (that is the Linux snap: releases/latest/download/tripscouts.snap); the fixed
      # address for the newest .apk is tripscouts.online/android (android/index.html looks up the newest release).
      - name: Publish the app as a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.$GITHUB_RUN_NUMBER"; G=$(grep -oP 'GAME_VERSION = \K[0-9]+' js/app.js)
          TAG="android-v$V"
          # A published release with the .apk is done. A draft (an earlier try that stopped between creating and publishing)
          # is removed and made again; a draft can still be deleted, a published release can't be changed.
          if STATE=$(gh release view "$TAG" --json isDraft,assets --jq '"\(.isDraft) \([.assets[].name] | index("cabin-week.apk") != null)"' 2>/dev/null); then
            if [ "$STATE" = "false true" ]; then
              echo "::notice::The release $TAG already exists (releases can't be changed)."
              exit 0
            fi
            echo "::warning::The release $TAG was left unfinished ($STATE); making it again."
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" cabin-week.apk --target "$GITHUB_SHA" --latest=false --title "Android app $V (game v$G)" \
            --notes "TripScouts for Android (phone, tablet, Google TV), version $V with game version $G. On a Google TV, type tripscouts.online/android in the Downloader app: it always gives the newest one (see docs/google-tv.md)."
